name: Phase 0.5 MySQL Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'Moshtariyar/**'
      - '.github/workflows/phase-0-5-mysql-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mysql-gate:
    name: PHP + real MySQL migrations + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Moshtariyar

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: moshtariyar_gate
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@v4

      - name: Setup PHP 8.3 with MySQL extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, bcmath, intl, pdo, pdo_mysql
          coverage: none

      - name: Show runtime versions
        run: |
          php -v
          php -m | sort
          mysql --version

      - name: Validate every PHP file
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" >/dev/null; then
              echo "SYNTAX FAIL: $file"
              failures=$((failures + 1))
            fi
          done < <(find . -type f -name '*.php' -print0)
          if [ "$failures" -ne 0 ]; then
            echo "$failures PHP file(s) failed syntax validation."
            exit 1
          fi
          echo 'FULL PHP SYNTAX: PASS'

      - name: Install locked dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Build isolated test environment
        shell: bash
        run: |
          cp .env.example .env
          php artisan key:generate --force
          sed -i 's/^APP_ENV=.*/APP_ENV=testing/' .env
          sed -i 's/^APP_DEBUG=.*/APP_DEBUG=true/' .env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^DB_PORT=.*/DB_PORT=3306/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=moshtariyar_gate/' .env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=root/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=root/' .env
          sed -i 's/^MAIL_MAILER=.*/MAIL_MAILER=array/' .env
          sed -i 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env
          sed -i 's/^CACHE_STORE=.*/CACHE_STORE=file/' .env
          sed -i 's/^SESSION_DRIVER=.*/SESSION_DRIVER=file/' .env

      - name: Wait for MySQL
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then
              echo 'MySQL is ready.'
              exit 0
            fi
            sleep 2
          done
          echo 'MySQL did not become ready.'
          exit 1

      - name: Run real migrations from clean database
        run: php artisan migrate:fresh --force --no-interaction

      - name: Verify migration table and application connection
        run: |
          php artisan migrate:status
          php artisan tinker --execute="dump(DB::connection()->getDriverName()); dump(DB::select('select version() as version'));"

      - name: Run complete PHPUnit suite against MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: moshtariyar_gate
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test --testsuite=Feature,Unit --stop-on-failure

      - name: Verify no unexpected working-tree changes
        run: git diff --check
