<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="همدم - Hamdam">
  <defs>
    <linearGradient id="hd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#hd)" opacity="0.15"/>
  <!-- دو فیگور انسانی که به‌هم متصل‌اند (همدم/همراهی) -->
  <!-- فیگور راست -->
  <circle cx="17" cy="18" r="3.4" fill="none" stroke="url(#hd)" stroke-width="2.6"/>
  <path d="M11 33 v-3 a6 6 0 0 1 12 0 v3" fill="none" stroke="url(#hd)" stroke-width="2.6" stroke-linecap="round"/>
  <!-- فیگور چپ -->
  <circle cx="31" cy="18" r="3.4" fill="none" stroke="url(#hd)" stroke-width="2.6"/>
  <path d="M25 33 v-3 a6 6 0 0 1 12 0 v3" fill="none" stroke="url(#hd)" stroke-width="2.6" stroke-linecap="round"/>
  <!-- گرهٔ مرکزی ارتباط -->
  <circle cx="24" cy="26" r="3.6" fill="#0f172a" stroke="url(#hd)" stroke-width="2.6"/>
</svg>
